add_newline = true
command_timeout = 200
format = """$directory$git_branch$git_status$nodejs$python$rust$golang$java$fill$cmd_duration
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold #89b4fa)"
error_symbol = "[❯](bold #f38ba8)"
vimcmd_symbol = "[❮](bold #cba6f7)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
style = "bold #89b4fa"
repo_root_style = "bold #cba6f7"
repo_root_format = "[󰉋 $repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "#f9e2af"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold #cba6f7"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "#a6e3a1"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
conflicted = "! "
untracked = "? "
modified = "● "
staged = "✓ "
renamed = "» "
deleted = "✕ "
stashed = "≡ "

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "#a6e3a1"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "#f9e2af"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "#fab387"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "#89dceb"

[java]
symbol = " "
format = "[$symbol$version]($style) "
style = "#f38ba8"

[cmd_duration]
min_time = 2_000
format = "[󱎫 $duration]($style)"
style = "#6c7086"
